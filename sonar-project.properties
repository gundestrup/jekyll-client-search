# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-client-search
sonar.projectName=jekyll-client-search

sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=coverage/**,vendor/**,node_modules/**

# SimpleCov JSON report emitted by spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
