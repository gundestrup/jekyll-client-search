name: Release gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish RubyGem
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          # no ruby-version: — setup-ruby reads .ruby-version (single source)

      - name: Verify tag matches gem version
        run: test "v$(bundle exec rake version:show)" = "${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG has an entry for this version
        run: bundle exec rake version:check_changelog

      - name: Build gem
        run: gem build jekyll-client-search.gemspec

      - name: Upload gem to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: jekyll-client-search-*.gem

      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
