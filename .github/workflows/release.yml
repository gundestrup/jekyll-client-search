name: Release gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish RubyGem
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          ruby-version: "3.4.10"

      - name: Verify tag matches gem version
        run: test "v$(bundle exec rake version:show)" = "${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG has an entry for this version
        run: bundle exec rake version:check_changelog

      - name: Build gem
        run: gem build jekyll-client-search.gemspec

      - name: Upload gem to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: jekyll-client-search-*.gem

      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
