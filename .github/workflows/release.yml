name: Release gem

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    name: Build and publish RubyGem
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Verify tag matches gem version
        run: test "v$(bundle exec rake version:show)" = "${GITHUB_REF_NAME}"

      - name: Verify and build gem
        run: bundle exec rake ci

      - name: Publish to RubyGems using trusted publishing
        uses: rubygems/release-gem@v1
