name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby 3.4.10 tests (MiniSearch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run checks
        run: bundle exec rake ci
