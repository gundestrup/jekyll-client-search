name: Release gem

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish RubyGem
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Verify and build gem
        run: bundle exec rake ci

      - name: Publish to RubyGems using trusted publishing
        uses: rubygems/release-gem@v1
