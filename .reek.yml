# Reek configuration file
# https://github.com/troessner/reek/blob/master/docs/Configuration.md

exclude_paths:
  - lib/jekyll/client_search/version.rb
  - lib/jekyll-client-search.rb

detectors:
  IrresponsibleModule:
    enabled: false

  UtilityFunction:
    enabled: false

  BooleanParameter:
    enabled: false

  Attribute:
    enabled: false

  MissingSafeMethod:
    enabled: false

  NilCheck:
    enabled: false

  ManualDispatch:
    enabled: false

  DataClump:
    enabled: false

  RepeatedConditional:
    enabled: false

  TooManyMethods:
    enabled: false

  DuplicateMethodCall:
    enabled: true
    max_calls: 3

  FeatureEnvy:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Configuration#normalize_output"
      - "Jekyll::ClientSearch::Generator#embed_document"
      - "Jekyll::ClientSearch::RelatedAnalyzer#base_relation"
      - "Jekyll::ClientSearch::RelatedAnalyzer#domain_paths"
      - "Jekyll::ClientSearch::RelatedAnalyzer#metadata_score"
      - "Jekyll::ClientSearch::RelatedAnalyzer#sort_relations"
      - "Jekyll::ClientSearch::RelatedConfiguration#validate_max_items!"
      - "Jekyll::ClientSearch::RelatedConfiguration#validate_similarity!"
      - "Jekyll::ClientSearch::SearchTag#build_scripts"

  NestedIterators:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Generator#collection_documents"
      - "Jekyll::ClientSearch::Generator#add_runtime_asset"
      - "Jekyll::ClientSearch::RelatedAnalyzer#analyze"
      - "Jekyll::ClientSearch::RelatedAnalyzer#domain_paths"

  LongParameterList:
    enabled: true
    max_params: 5

  ControlParameter:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Configuration#merge_embedding_config"
      - "Jekyll::ClientSearch::Configuration#merge_query_embedder_config"
      - "Jekyll::ClientSearch::IndexCache#lookup"
      - "Jekyll::ClientSearch::LiveSearchConfiguration#debounce_ms"
      - "Jekyll::ClientSearch::RelatedAnalyzer#configured_intersection"
      - "Jekyll::ClientSearch::Tasks#copy_file"

  TooManyStatements:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Configuration#initialize"
      - "Jekyll::ClientSearch::Generator#generate"
      - "Jekyll::ClientSearch::Generator#embed_document"
      - "Jekyll::ClientSearch::Generator#enhance_with_embeddings"
      - "Jekyll::ClientSearch::Generator#add_runtime_asset"
      - "Jekyll::ClientSearch::Generator#collection_documents"
      - "Jekyll::ClientSearch::QueryEmbedderConfiguration#initialize"
      - "Jekyll::ClientSearch::QueryEmbedderConfiguration#validate!"
      - "Jekyll::ClientSearch::OllamaEmbeddingAdapter#embed"
      - "Jekyll::ClientSearch::RelatedAnalyzer#analyze"
      - "Jekyll::ClientSearch::RelatedAnalyzer#base_relation"
      - "Jekyll::ClientSearch::RelatedAnalyzer#build_relation"
      - "Jekyll::ClientSearch::RelatedAnalyzer#similarity"
      - "Jekyll::ClientSearch::RelatedTag#render"
      - "Jekyll::ClientSearch::RuntimeConfigPage#initialize"
      - "Jekyll::ClientSearch::SearchTag#render"
      - "Jekyll::ClientSearch::SearchTag#build_scripts"
      - "Jekyll::ClientSearch::SearchTag#engine_script"
      - "Jekyll::ClientSearch::Tasks#copy_file"
      - "Jekyll::ClientSearch::Tasks#diff_reference_files"
      - "Jekyll::ClientSearch::Tasks#install_file"
      - "Jekyll::ClientSearch::Tasks#install_reference_files"
      - "Jekyll::ClientSearch::Tasks#list_reference_files"

  UncommunicativeVariableName:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::OllamaEmbeddingAdapter#embed"
      - "Jekyll::ClientSearch::RelatedAnalyzer#similarity"

  InstanceVariableAssumption:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Generator"

  TooManyInstanceVariables:
    enabled: true
    exclude:
      - "Jekyll::ClientSearch::Configuration"
      - "Jekyll::ClientSearch::Generator"
